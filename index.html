<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAR Monitor · 台灣衛星取像儀表板</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>🛰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root {
  --bg:      #05090f;
  --surface: #0b1320;
  --card:    #0f1a2b;
  --border:  #1b2d45;
  --border2: #243850;
  --cyan:    #00e5ff;
  --cyan-dim:#007a8a;
  --orange:  #ff7043;
  --green:   #00e676;
  --amber:   #ffc107;
  --purple:  #ce93d8;
  --text:    #b0bec5;
  --text-hi: #e0e8f0;
  --muted:   #455a6a;
  --sidebar: 400px;
  --hdr:     52px;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Noto Sans TC', sans-serif;
  --font-bump: 4px;
}

:root[data-theme="night-ops"] {
  --bg:      #05090f;
  --surface: #0b1320;
  --card:    #0f1a2b;
  --border:  #1b2d45;
  --border2: #243850;
  --cyan:    #00e5ff;
  --cyan-dim:#007a8a;
  --orange:  #ff7043;
  --green:   #00e676;
  --amber:   #ffc107;
  --purple:  #ce93d8;
  --text:    #b0bec5;
  --text-hi: #e0e8f0;
  --muted:   #455a6a;
}

:root[data-theme="paper-radar"] {
  --bg:      #f4efe4;
  --surface: #fbf7ed;
  --card:    #efe4d0;
  --border:  #d6c4a6;
  --border2: #bea884;
  --cyan:    #1f6f78;
  --cyan-dim:#6a8f93;
  --orange:  #b65d31;
  --green:   #2f7d4d;
  --amber:   #a97400;
  --purple:  #7d5fa3;
  --text:    #50483b;
  --text-hi: #241f17;
  --muted:   #8f806c;
}

:root[data-theme="field-survey"] {
  --bg:      #0c1310;
  --surface: #131f18;
  --card:    #1a2a21;
  --border:  #294034;
  --border2: #385645;
  --cyan:    #86f0b6;
  --cyan-dim:#4f9b73;
  --orange:  #ff9b54;
  --green:   #9afc74;
  --amber:   #ffd166;
  --purple:  #b5a4ff;
  --text:    #c8d5cb;
  --text-hi: #eef5ef;
  --muted:   #7b9383;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

/* ═══ HEADER ═══════════════════════════════════════════════════════════════ */
header {
  height: var(--hdr);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 18px;
  flex-shrink: 0;
  z-index: 200;
}

.hdr-logo {
  font-family: var(--mono);
  font-size: calc(12px + var(--font-bump));
  font-weight: 600;
  color: var(--cyan);
  letter-spacing: 3px;
  white-space: nowrap;
}
.hdr-logo em { color: var(--orange); font-style: normal; }

.hdr-sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }

.hdr-status {
  font-family: var(--mono);
  font-size: calc(10px + var(--font-bump) - 1px);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hdr-status b { color: var(--green); }

.hdr-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.control-field {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.control-field label {
  font-family: var(--mono);
  font-size: calc(8px + var(--font-bump) - 2px);
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
}

.control-field select {
  min-width: 132px;
  padding: 5px 8px;
  border: 1px solid var(--border2);
  background: var(--card);
  color: var(--text-hi);
  font-family: var(--mono);
  font-size: calc(10px + var(--font-bump) - 1px);
}

.control-field select:focus {
  outline: none;
  border-color: var(--cyan);
}

.hdr-tabs {
  margin-left: auto;
  display: flex;
  gap: 6px;
}

.tab {
  font-family: var(--mono);
  font-size: calc(9px + var(--font-bump) - 1px);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 5px 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
}
.tab:hover, .tab.on { border-color: var(--cyan); color: var(--cyan); background: rgba(0,229,255,.06); }

/* ═══ BODY LAYOUT ══════════════════════════════════════════════════════════ */
.layout { flex: 1; display: flex; overflow: hidden; }

/* ═══ SIDEBAR ══════════════════════════════════════════════════════════════ */
.sidebar {
  width: var(--sidebar);
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sb-head {
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-head h2 {
  font-family: var(--mono);
  font-size: calc(10px + var(--font-bump));
  letter-spacing: 2px;
  color: var(--cyan);
  text-transform: uppercase;
}
.sb-head .sub { font-size: calc(11px + var(--font-bump) - 1px); color: var(--muted); margin-top: 2px; }

/* filter chips */
.sb-filters {
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  flex-shrink: 0;
}
.chip {
  font-family: var(--mono);
  font-size: calc(9px + var(--font-bump) - 1px);
  letter-spacing: .5px;
  padding: 3px 10px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all .12s;
}
.chip.on             { border-color: var(--cyan);   color: var(--cyan);   background: rgba(0,229,255,.07); }
.chip[data-b="C"].on { border-color: #00b4d8;       color: #00b4d8;       background: rgba(0,180,216,.07); }
.chip[data-b="L"].on { border-color: var(--purple);  color: var(--purple);  background: rgba(206,147,216,.07); }
.chip[data-b="X"].on { border-color: var(--orange);  color: var(--orange);  background: rgba(255,112,67,.07); }
.chip[data-b="S"].on { border-color: var(--amber);   color: var(--amber);   background: rgba(255,193,7,.07); }

.filter-panel {
  padding: 12px 16px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}
.filter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.filter-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.filter-field.wide {
  grid-column: 1 / -1;
}
.filter-label {
  font-family: var(--mono);
  font-size: calc(8px + var(--font-bump) - 2px);
  letter-spacing: 1px;
  color: var(--muted);
  text-transform: uppercase;
}
.filter-select,
.filter-input {
  width: 100%;
  background: var(--card);
  color: var(--text-hi);
  border: 1px solid var(--border2);
  padding: 7px 9px;
  font-family: var(--mono);
  font-size: calc(11px + var(--font-bump) - 1px);
}
.filter-select:focus,
.filter-input:focus {
  outline: none;
  border-color: var(--cyan);
}
.format-options {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.format-chip {
  font-family: var(--mono);
  font-size: calc(9px + var(--font-bump) - 1px);
  letter-spacing: .4px;
  padding: 5px 10px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all .12s;
}
.format-chip.on {
  border-color: var(--green);
  color: var(--green);
  background: rgba(0,230,118,.08);
}
.filter-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.filter-note {
  font-size: calc(10px + var(--font-bump) - 1px);
  color: var(--muted);
}
.filter-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: calc(9px + var(--font-bump) - 1px);
  color: var(--text);
}
.filter-toggle input {
  accent-color: var(--cyan);
}

/* satellite list */
.sb-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0 8px;
}
.sb-list::-webkit-scrollbar { width: 3px; }
.sb-list::-webkit-scrollbar-thumb { background: var(--border2); }

.group-label {
  font-family: var(--mono);
  font-size: calc(8px + var(--font-bump) - 2px);
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  padding: 10px 16px 4px;
}

.sat-fold {
  margin: 8px 12px 0;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.02);
}

.sat-fold summary {
  list-style: none;
  cursor: pointer;
  padding: 10px 14px;
  font-family: var(--mono);
  font-size: calc(10px + var(--font-bump) - 1px);
  color: var(--text-hi);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sat-fold summary::-webkit-details-marker { display: none; }
.sat-fold summary::after {
  content: '+';
  color: var(--cyan);
  font-size: calc(14px + var(--font-bump) - 1px);
}
.sat-fold[open] summary::after { content: '-'; }

.sat-fold-note {
  padding: 0 14px 10px;
  color: var(--muted);
  font-size: calc(10px + var(--font-bump) - 2px);
  line-height: 1.5;
}

.sat-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: all .12s;
  border-bottom: 1px solid rgba(27,45,69,.6);
}
.sat-row:hover  { background: rgba(0,229,255,.08); border-left-color: var(--cyan); }
.sat-row.active {
  background: linear-gradient(90deg, rgba(0,229,255,.22), rgba(0,229,255,.06));
  border-left-color: var(--cyan);
  box-shadow: inset 0 0 0 1px rgba(0,229,255,.2);
}

/* pulse dot */
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  position: relative;
}
.dot.op  { background: var(--green); box-shadow: 0 0 5px var(--green); }
.dot.op::after {
  content:''; position:absolute; inset:-3px; border-radius:50%;
  border: 1px solid var(--green);
  animation: pulse 2.5s ease-out infinite;
}
@keyframes pulse { 0%{opacity:.5;transform:scale(1)} 100%{opacity:0;transform:scale(2.2)} }
.dot.ret { background: var(--muted); }
.dot.up  { background: var(--amber); box-shadow: 0 0 5px var(--amber); }

.sat-info { flex: 1; min-width: 0; }
.sat-name { font-size: calc(12px + var(--font-bump)); font-weight: 700; color: var(--text-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sat-meta { font-family: var(--mono); font-size: calc(9px + var(--font-bump) - 1px); color: var(--muted); margin-top: 1px; }

.badges { display: flex; gap: 3px; flex-shrink: 0; align-items: center; }
.badge {
  font-family: var(--mono);
  font-size: calc(8px + var(--font-bump) - 2px);
  padding: 1px 5px;
  border: 1px solid;
  letter-spacing: .3px;
}
.bC { border-color: #00b4d8; color: #00b4d8; }
.bL { border-color: var(--purple); color: var(--purple); }
.bX { border-color: var(--orange); color: var(--orange); }
.bS { border-color: var(--amber); color: var(--amber); }
.bP { border-color: var(--green); color: var(--green); }

.this-week {
  font-family: var(--mono);
  font-size: calc(8px + var(--font-bump) - 2px);
  color: var(--green);
  border: 1px solid var(--green);
  padding: 1px 4px;
  opacity: .8;
}

/* ═══ MAP SECTION ═══════════════════════════════════════════════════════════ */
.map-wrap {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#map {
  flex: 1;
  background: #030810;
}

/* stats overlay */
.map-stats {
  position: absolute;
  top: 12px; left: 12px;
  z-index: 400;
  display: flex;
  gap: 8px;
  pointer-events: none;
}
.stat-card {
  background: rgba(11,19,32,.9);
  border: 1px solid var(--border2);
  padding: 8px 13px;
  backdrop-filter: blur(6px);
  pointer-events: all;
}
.stat-card .lbl {
  font-family: var(--mono);
  font-size: calc(8px + var(--font-bump) - 2px);
  letter-spacing: 1px;
  color: var(--muted);
  text-transform: uppercase;
}
.stat-card .val {
  font-family: var(--mono);
  font-size: calc(22px + var(--font-bump));
  font-weight: 600;
  color: var(--cyan);
  line-height: 1.1;
}
.stat-card .val.orange { color: var(--orange); }
.stat-card .val.small  { font-size: calc(13px + var(--font-bump)); padding-top: 4px; }

/* legend */
.map-legend {
  position: absolute;
  bottom: 70px; right: 12px;
  z-index: 400;
  background: rgba(11,19,32,.9);
  border: 1px solid var(--border2);
  padding: 10px 14px;
  backdrop-filter: blur(6px);
  min-width: 150px;
}
.legend-title {
  font-family: var(--mono);
  font-size: calc(8px + var(--font-bump) - 2px);
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}
.legend-swatch {
  width: 24px; height: 3px;
  border-radius: 1px;
  flex-shrink: 0;
}
.legend-item span {
  font-family: var(--mono);
  font-size: calc(9px + var(--font-bump) - 1px);
  color: var(--text);
}

/* ═══ DOWNLOAD BAR ══════════════════════════════════════════════════════════ */
.dl-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  z-index: 400;
  background: rgba(11,19,32,.95);
  border-top: 1px solid var(--border2);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  backdrop-filter: blur(8px);
}
.dl-label {
  font-family: var(--mono);
  font-size: calc(9px + var(--font-bump) - 1px);
  letter-spacing: 1px;
  color: var(--muted);
  text-transform: uppercase;
  flex-shrink: 0;
}
.dl-btn {
  font-family: var(--mono);
  font-size: calc(9px + var(--font-bump) - 1px);
  letter-spacing: .5px;
  padding: 6px 14px;
  border: 1px solid;
  background: transparent;
  cursor: pointer;
  transition: all .12s;
  text-decoration: none;
  display: inline-block;
  white-space: nowrap;
}
.dl-btn.asf  { border-color: var(--cyan);   color: var(--cyan);   }
.dl-btn.asf:hover  { background: rgba(0,229,255,.12); }
.dl-btn.cop  { border-color: var(--orange);  color: var(--orange);  }
.dl-btn.cop:hover  { background: rgba(255,112,67,.12); }
.dl-btn.csv  { border-color: var(--muted);   color: var(--muted);   }
.dl-btn.csv:hover  { border-color: var(--text); color: var(--text); }
.dl-btn:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.dl-count {
  font-family: var(--mono);
  font-size: calc(11px + var(--font-bump) - 1px);
  color: var(--green);
  margin-left: auto;
  white-space: nowrap;
}

/* ═══ DETAIL DRAWER ═════════════════════════════════════════════════════════ */
.drawer {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 290px;
  z-index: 500;
  background: rgba(11,19,32,.97);
  border-left: 1px solid var(--border2);
  backdrop-filter: blur(12px);
  transform: translateX(100%);
  transition: transform .22s ease;
  overflow-y: auto;
  padding: 16px;
}
.drawer.open { transform: translateX(0); }
.drawer::-webkit-scrollbar { width: 3px; }
.drawer::-webkit-scrollbar-thumb { background: var(--border2); }

.drawer-close {
  position: absolute; top: 12px; right: 12px;
  font-family: var(--mono); font-size: calc(10px + var(--font-bump) - 1px);
  color: var(--muted); background: none; border: none; cursor: pointer;
}
.drawer-close:hover { color: var(--text-hi); }

.d-name   { font-family: var(--mono); font-size: calc(13px + var(--font-bump)); font-weight: 600; color: var(--cyan); margin-right: 24px; margin-bottom: 3px; line-height: 1.3; }
.d-agency { font-size: calc(11px + var(--font-bump) - 1px); color: var(--muted); margin-bottom: 14px; }

.d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.d-item .k { font-family: var(--mono); font-size: calc(8px + var(--font-bump) - 2px); letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
.d-item .v { font-size: calc(12px + var(--font-bump) - 1px); font-weight: 700; color: var(--text-hi); line-height: 1.3; }
.d-item .v small { font-size: calc(10px + var(--font-bump) - 1px); font-weight: 400; color: var(--text); }

.d-section { font-family: var(--mono); font-size: calc(8px + var(--font-bump) - 2px); letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.d-desc { font-size: calc(11px + var(--font-bump) - 1px); color: var(--text); line-height: 1.7; }

.d-week-badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: calc(9px + var(--font-bump) - 1px);
  padding: 3px 10px;
  border: 1px solid var(--green);
  color: var(--green);
  margin-bottom: 14px;
}

/* ═══ LEAFLET OVERRIDES ═════════════════════════════════════════════════════ */
.leaflet-popup-content-wrapper {
  background: rgba(11,19,32,.97) !important;
  border: 1px solid var(--border2) !important;
  border-radius: 0 !important;
  color: var(--text) !important;
  box-shadow: 0 4px 24px rgba(0,0,0,.5) !important;
}
.leaflet-popup-tip { background: var(--border2) !important; }
.leaflet-control-zoom a { background: var(--surface) !important; color: var(--text) !important; border-color: var(--border2) !important; }

:root[data-theme="paper-radar"] .leaflet-tile-pane {
  filter: saturate(.45) brightness(1.35) contrast(.9);
}

:root[data-theme="field-survey"] .leaflet-tile-pane {
  filter: hue-rotate(18deg) saturate(.75) brightness(.95);
}

.fp { font-family: var(--mono); }
.fp h4 { font-size: calc(10px + var(--font-bump) - 1px); color: var(--cyan); margin-bottom: 7px; line-height: 1.4; }
.fp p  { font-size: calc(9px + var(--font-bump) - 1px); color: var(--muted); margin: 2px 0; }
.fp b  { color: var(--text-hi); }

/* ═══ LOADING ═══════════════════════════════════════════════════════════════ */
#loading {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 9999; transition: opacity .4s;
}
#loading.gone { opacity: 0; pointer-events: none; }
.ld-txt {
  font-family: var(--mono);
  font-size: calc(11px + var(--font-bump) - 1px);
  letter-spacing: 4px;
  color: var(--cyan);
  margin-bottom: 18px;
}
.ld-bar { width: 180px; height: 1px; background: var(--border2); overflow: hidden; position: relative; }
.ld-bar::after {
  content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
  background: var(--cyan);
  animation: ldslide 1.1s ease-in-out infinite;
}
@keyframes ldslide { 0%{left:-100%} 100%{left:100%} }
.ld-sub {
  font-family: var(--mono);
  font-size: calc(9px + var(--font-bump) - 1px);
  color: var(--muted);
  margin-top: 14px;
  letter-spacing: 1px;
}
</style>
</head>
<body>

<div id="loading">

const PLATFORM_COLORS = {
  'S1A':'#00e5ff','S1C':'#00b8d4','S1D':'#0097b2',

  'R2':'#ffc107','RCM':'#ffb300',
  '_default':'#ff7043',
};

function platColor(platform) {
  const p = (platform||'').toUpperCase();
  for (const k of Object.keys(PLATFORM_COLORS)) {
    if (p.startsWith(k.toUpperCase())) return PLATFORM_COLORS[k];
  }
  return PLATFORM_COLORS._default;
}

function isOpenDataSatelliteId(id) {
  return OPEN_DATA_SATELLITES.has(String(id || '').toUpperCase());
}

function isSentinelSatelliteId(id) {
  return SENTINEL_SATELLITES.has(String(id || '').toUpperCase());
}

function getFramePathNumber(frame) {
  return normalizeFrameNumber(frame.path_number) ?? normalizeFrameNumber(frame.orbit);
}

function getTrackLabelForFrame(frame) {
  const satId = String(frame.satellite_id || frame.platform || '').toUpperCase();
  const direction = normalizeDirection(frame.direction_norm || frame.direction);
  const pathNumber = getFramePathNumber(frame);

  if (satId.includes('NISAR')) return 'NISAR';
  if (isSentinelSatelliteId(satId)) {
    if (direction === 'ASCENDING' && pathNumber === 69) return 'A69';
    if (direction === 'DESCENDING' && pathNumber === 105) return 'D105';
    return 'OTHER_S1';
  }
  return 'OTHER';
}

  L.polygon(TW_OUTLINE, { color:'#00e5ff', weight:1, fillColor:'#00e5ff', fillOpacity:.04, dashArray:'4 3' }).addTo(state.map);

  state.frameLayer = L.layerGroup().addTo(state.map);

  // 點擊地圖背景時取消選取
  state.map.on('click', () => {
    if (state.selectedFrameKey) {
      state.selectedFrameKey = null;
      if (typeof updateMapSelectionState === 'function') updateMapSelectionState();
      closeDrawer();
    }
  });
}

// RENDER SATELLITE LIST
// ═══════════════════════════════════════════════════════════════════════════
function renderSatList() {
  const list = document.getElementById('sat-list');
  list.innerHTML = '';

  // Which satellites had Taiwan frames this week?
  const activePlatforms = new Set(state.frames.map(f => (f.platform||'').toUpperCase().slice(0,4)));

  const filtered = SATS.filter(s => {
    if (state.band !== 'ALL' && s.band !== state.band) return false;
    if (state.tab === 'op'  && s.status === 'ret') return false;
    if (state.tab === 'tw') {
      // show only sats with frames this week
      return hasThisWeek(s, activePlatforms);
    }
    return true;
  });

  const groups = [
    { key:'op',  label:'● 現役衛星' },
    { key:'ret', label:'○ 歷史任務' },
  ];

  let total = 0;
  for (const g of groups) {
    const sats = filtered.filter(s => s.status === g.key);
    if (!sats.length) continue;
    const gl = document.createElement('div');
    gl.className = 'group-label';
    gl.textContent = g.label;
    list.appendChild(gl);

    for (const sat of sats) {
      total++;
      const thisWeek = hasThisWeek(sat, activePlatforms);
      const row = document.createElement('div');
      row.className = 'sat-row' + (state.selectedSat?.id === sat.id ? ' active' : '');
      row.onclick = () => openDrawer(sat, row, thisWeek);

      row.innerHTML = `
        <div class="dot ${sat.status}"></div>
        <div class="sat-info">
          <div class="sat-name">${sat.name}</div>
          <div class="sat-meta">${sat.agency} · ${sat.launched.slice(0,4)}${sat.retired?' – '+sat.retired.slice(0,4):''} · ${sat.res}</div>
        </div>
        <div class="badges">
          ${thisWeek ? '<span class="this-week">本週</span>' : ''}
          <span class="badge b${sat.band}">${sat.band}</span>
        </div>`;
      list.appendChild(row);
    }
  }

  document.getElementById('sb-count').textContent = `顯示 ${total} 顆衛星`;
}

function hasThisWeek(sat, activePlatforms) {
  for (const pfx of sat.asf_prefix||[]) {
    if (activePlatforms.has(pfx.toUpperCase().slice(0,4))) return true;
  }
  return false;
}

const DEFAULT_PRODUCT_TYPES = ['SLC', 'GSLC'];
const DEFAULT_PRODUCT_TYPES_BY_SATELLITE = {
  ALL: ['SLC', 'GSLC'],
  NISAR: ['GSLC'],
  S1A: ['SLC'],
  S1B: ['SLC'],
  S1C: ['SLC'],
  S1D: ['SLC'],

const KNOWN_PRODUCT_TYPES = ['L1_RSLC', 'L1_GSLC', 'L2_GCOV', 'L2_GUNW', 'GSLC', 'RSLC', 'SLC', 'GRD_HD', 'GRD_MS', 'GRD_HS', 'GRD_FD', 'GRD', 'GCOV', 'GUNW', 'RAW', 'SSC', 'OCN'];

function normalizeDirection(value) {
  const text = String(value || '').toUpperCase();
  if (text.startsWith('A')) return 'ASCENDING';
  if (text.startsWith('D')) return 'DESCENDING';
  return 'UNKNOWN';
}

function normalizeFrameNumber(value) {
  const num = Number.parseInt(String(value ?? '').trim(), 10);
  return Number.isFinite(num) ? num : null;
}

function normalizeProductType(frame) {
  const candidates = [frame.product_type, frame.processing_level, frame.processingLevel, frame.granule];
  for (const raw of candidates) {
    const text = String(raw || '').toUpperCase().replace('.SAFE', '');
    if (!text) continue;
    for (const item of KNOWN_PRODUCT_TYPES) {
      if (text.includes(item)) return item;
    }
  }
  return 'OCN';
}

function satMatchesFrame(sat, frame) {
  const haystack = [frame.platform, frame.granule, frame.satellite_name, frame.satellite_id].join(' ').toUpperCase();
  const names = [sat.id, sat.name, ...(sat.asf_prefix || [])].map(v => String(v || '').toUpperCase());
  return names.some(name => name && haystack.includes(name));
}

function getSatForFrame(frame) {
  return SATS.find(sat => satMatchesFrame(sat, frame)) || null;
}

function enhanceFrame(frame) {
  const sat = getSatForFrame(frame) || {};
  const satelliteId = sat.id || frame.platform || 'UNKNOWN';
  const directionNorm = normalizeDirection(frame.direction);
  const pathNumberNorm = getFramePathNumber(frame);
  const frameNumberNorm = normalizeFrameNumber(frame.frame_number);
  const enriched = {
    ...frame,
    satellite_id: satelliteId,
    satellite_name: sat.name || frame.platform || 'Unknown',
    satellite_band: sat.band || '',
    sat_status: sat.status || '',
    direction_norm: directionNorm,
    path_number_norm: pathNumberNorm,
    frame_number_norm: frameNumberNorm,
    product_type_norm: normalizeProductType(frame),
  };
  const trackLabel = getTrackLabelForFrame(enriched);
  return {
    ...enriched,
    track_label: trackLabel,
    is_open_data: isOpenDataSatelliteId(satelliteId),
    is_priority_track: trackLabel === 'A69' || trackLabel === 'D105' || trackLabel === 'NISAR',
  };
}

async function loadData() {
  ensureAdvancedState();
  ldmsg('Loading cached frame inventory...');
  try {
    const response = await fetch('./data/sar_status.json?v=' + Date.now());
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (!Array.isArray(data.taiwan_frames)) throw new Error('Invalid payload');

    document.getElementById('hdr-time').textContent = `${data.updated_at || '--'}${data.version ? ` · data ${data.version}` : ''}`;
    state.baseStats = data;
    state.rawFrames = data.taiwan_frames.map(enhanceFrame).filter(frame => frame.is_open_data);
    bindAdvancedControls();
    renderSatelliteSelect();
    renderFormatOptions();
    resetAdvancedFilters(false);
    applyAdvancedFilters();
    return;
  } catch (error) {
    console.warn('Cached JSON unavailable, fallback to live ASF query.', error);
  }

  ldmsg('Loading live ASF frames...');
  await liveFetchASF();
}

async function liveFetchASF() {
  ensureAdvancedState();
  const now  = new Date();
  const wa   = new Date(now - 7 * 24 * 3600 * 1000);
  const fmt  = d => d.toISOString().replace(/\.\d+Z$/, 'UTC');
  const WKT  = 'POLYGON((121.5902 25.467,121.209 25.3739,120.8073 25.0382,119.9008 23.7334,119.9935 22.7865,120.5601 21.8426,120.9412 21.7277,122.167 25.0289,121.5902 25.467))';

  const url = 'https://api.daac.asf.alaska.edu/services/search/param?' + new URLSearchParams({
    intersectsWith: WKT,
    platform: 'S1A,S1C,S1D,A3,A4,R2,RCM,NISAR',
    processingLevel: 'SLC,GRD_HD,GRD_MS,GRD_HS,GRD_FD,RSLC,GSLC,L1_RSLC,L1_GSLC,L2_GCOV,L2_GUNW',
    start: fmt(wa),
    end: fmt(now),
    output: 'geojson',
    maxresults: 1000,
  });

  try {
    const response = await fetch(url);
    const gj = await response.json();

    const s1Platforms = ['S1A', 'S1C', 'S1D']; // Sentinel-1 平台代碼

    const filteredFeatures = (gj.features || []).filter(feature => {
      const p = feature.properties || {};
      const platform = (p.platform || '').toUpperCase();
      if (s1Platforms.includes(platform)) {
        const pathNumber = String(p.pathNumber);
        const direction = (p.flightDirection || '').toUpperCase();
        // 根據使用者需求過濾 Sentinel-1 軌道 (105 為降軌, 69 為升軌)
        return (pathNumber === '105' && direction === 'DESCENDING') ||
               (pathNumber === '69' && direction === 'ASCENDING');
      }
      return true; // 保留非 S1 的衛星
    });

    state.rawFrames = filteredFeatures.map(feature => {
      const p = feature.properties || {};
      return enhanceFrame({
        source: 'ASF',
        granule: p.sceneName || '',
        platform: p.platform || '',
        sensor: p.sensor || '',
        date: p.startTime || '',
        stop_time: p.stopTime || '',
        mode: p.beamModeType || p.beamMode || '',
        polarization: p.polarization || '',
        orbit: p.orbit || '',
        path_number: p.pathNumber || '',
        frame_number: p.frameNumber || '',
        direction: p.flightDirection || '',
        product_type: p.processingLevel || '',
        processing_level: p.processingLevel || '',
        footprint: feature.geometry,
        asf_url: p.url || '',
        file_size_mb: +(p.sizeMB || 0).toFixed(1),
      });
    }).filter(frame => frame.is_open_data);

    state.baseStats = {
      total_frames: state.rawFrames.length,
      query_start: wa.toISOString(),
      query_end: now.toISOString(),
      asf_count: state.rawFrames.length,
      copernicus_count: 0,
    };
    document.getElementById('hdr-time').textContent = 'Live ASF ' + new Date().toLocaleString('zh-TW');
    bindAdvancedControls();
    renderSatelliteSelect();
    renderFormatOptions();
    resetAdvancedFilters(false);
    applyAdvancedFilters();
  } catch (error) {
    document.getElementById('hdr-time').textContent = 'Load failed';
    console.error('ASF API failed', error);
  }
}

function matchesSidebarFilters(sat) {
  ensureAdvancedState();
  if (!isOpenDataSatelliteId(sat.id)) return false;
  if (state.band !== 'ALL' && sat.band !== state.band) return false;
  if (state.tab === 'op' && sat.status === 'ret') return false;
  if (state.tab === 'tw') return state.rawFrames.some(frame => satMatchesFrame(sat, frame));
  return true;
}

function bindAdvancedControls() {
  if (bindAdvancedControls.done) return;
  bindAdvancedControls.done = true;

  document.getElementById('filter-satellite')?.addEventListener('change', event => {
    state.filters.satellite = event.target.value;
    state.selectedSat = SATS.find(s => s.id === state.filters.satellite) || null;
    renderFormatOptions();
    applyAdvancedFilters();
  });

  document.getElementById('filter-direction')?.addEventListener('change', event => {
    state.filters.direction = event.target.value;
    applyAdvancedFilters();
  });

  document.getElementById('filter-show-other-tracks')?.addEventListener('change', event => {
    state.filters.showOtherSentinelTracks = !!event.target.checked;
    applyAdvancedFilters();
  });

  for (const id of ['filter-frame-min', 'filter-frame-max', 'filter-path-min', 'filter-path-max', 'filter-date-start', 'filter-date-end']) {
    document.getElementById(id)?.addEventListener('input', event => {
      let key = '';
      if (id === 'filter-frame-min') key = 'frameMin';
      if (id === 'filter-frame-max') key = 'frameMax';
      if (id === 'filter-path-min') key = 'pathMin';
      if (id === 'filter-path-max') key = 'pathMax';
      if (id === 'filter-date-start') key = 'dateStart';
      if (id === 'filter-date-end') key = 'dateEnd';
      if (key) {
        state.filters[key] = event.target.value.trim();
        applyAdvancedFilters();
      }
    });
  }

  for (const id of ['btn-asf', 'btn-cop']) {
    const el = document.getElementById(id);
    if (el && el.tagName === 'A') el.removeAttribute('href');
  }
}

function renderSatelliteSelect() {
  ensureAdvancedState();
  const select = document.getElementById('filter-satellite');
  if (!select) return;

  const counts = new Map();
  for (const frame of state.rawFrames) counts.set(frame.satellite_id, (counts.get(frame.satellite_id) || 0) + 1);

  const visibleSats = SATS.filter(matchesSidebarFilters).filter(sat => (counts.get(sat.id) || 0) > 0);
  const orderedSats = [
    ...visibleSats.filter(isFeaturedSatellite),
    ...visibleSats.filter(sat => !isFeaturedSatellite(sat)),
  ];

  const options = ['<option value="ALL">All satellites</option>'];
  for (const sat of orderedSats) {
    const count = counts.get(sat.id) || 0;
    options.push(`<option value="${sat.id}">${sat.name}${count ? ` (${count})` : ''}</option>`);
  }
  select.innerHTML = options.join('');
  if (![...select.options].some(opt => opt.value === state.filters.satellite)) {
    state.filters.satellite = 'ALL';
  }
  select.value = state.filters.satellite;
}

function getFormatPoolFrames() {
  ensureAdvancedState();
  if (state.filters.satellite === 'ALL') return state.rawFrames;
  return state.rawFrames.filter(frame => frame.satellite_id === state.filters.satellite);
}

function getDefaultFormatsForSatellite(types) {
  const satKey = state.filters.satellite === 'ALL' ? 'ALL' : state.filters.satellite;
  const preferred = DEFAULT_PRODUCT_TYPES_BY_SATELLITE[satKey] || DEFAULT_PRODUCT_TYPES;
  const defaults = types.filter(type => preferred.includes(type));
  return defaults.length ? defaults : types;
}

function renderFormatOptions() {
  ensureAdvancedState();
  const wrap = document.getElementById('format-options');
  if (!wrap) return;

  const types = [...new Set(getFormatPoolFrames().map(frame => frame.product_type_norm).filter(Boolean))].sort();
  if (!types.length) {
    wrap.innerHTML = '<span class="filter-note">No product types in current inventory.</span>';
    state.filters.formats = new Set();
    return;
  }

  const stillValid = [...state.filters.formats].filter(type => types.includes(type));
  if (!stillValid.length) {
    state.filters.formats = new Set(getDefaultFormatsForSatellite(types));
  } else if (stillValid.length !== state.filters.formats.size) {
    state.filters.formats = new Set(stillValid);
  }

  wrap.innerHTML = '';
  for (const type of types) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'format-chip' + (state.filters.formats.has(type) ? ' on' : '');
    button.textContent = type;
    button.onclick = () => {
      if (state.filters.formats.has(type)) state.filters.formats.delete(type);
      else state.filters.formats.add(type);
      renderFormatOptions();
      applyAdvancedFilters();
    };
    wrap.appendChild(button);
  }
}

function resetAdvancedFilters(apply = true) {
  ensureAdvancedState();
  const allTypes = [...new Set(state.rawFrames.map(frame => frame.product_type_norm).filter(Boolean))];
  state.filters.satellite = 'ALL';
  state.filters.direction = 'ALL';
  state.filters.showOtherSentinelTracks = false;
  state.filters.pathMin = '';
  state.filters.pathMax = '';
  state.filters.frameMin = '';
  state.filters.frameMax = '';
  state.filters.dateStart = '';
  state.filters.dateEnd = '';
  state.filters.formats = new Set(getDefaultFormatsForSatellite(allTypes));
  state.selectedSat = null;

  const satSel = document.getElementById('filter-satellite');
  const dirSel = document.getElementById('filter-direction');
  const pathMin = document.getElementById('filter-path-min');
  const pathMax = document.getElementById('filter-path-max');
  const frameMin = document.getElementById('filter-frame-min');
  const frameMax = document.getElementById('filter-frame-max');
  const dateStart = document.getElementById('filter-date-start');
  const dateEnd = document.getElementById('filter-date-end');
  const showOtherTracks = document.getElementById('filter-show-other-tracks');
  if (satSel) satSel.value = 'ALL';
  if (dirSel) dirSel.value = 'ALL';
  if (showOtherTracks) showOtherTracks.checked = false;
  if (pathMin) pathMin.value = '';
  if (pathMax) pathMax.value = '';
  if (frameMin) frameMin.value = '';
  if (frameMax) frameMax.value = '';
  if (dateStart) dateStart.value = '';
  if (dateEnd) dateEnd.value = '';
  renderFormatOptions();
  if (apply) applyAdvancedFilters();
}

function frameMatchesAdvancedFilters(frame) {
  if (!frame.is_open_data) return false;
  if (frame.track_label === 'OTHER_S1' && !state.filters.showOtherSentinelTracks) return false;
  if (state.band !== 'ALL' && frame.satellite_band !== state.band) return false;
  if (state.tab === 'op' && frame.sat_status === 'ret') return false;
  if (state.filters.satellite !== 'ALL' && frame.satellite_id !== state.filters.satellite) return false;
  if (state.filters.direction !== 'ALL' && frame.direction_norm !== state.filters.direction) return false;
  if (state.filters.formats.size && !state.filters.formats.has(frame.product_type_norm)) return false;

  const pathMinVal = normalizeFrameNumber(state.filters.pathMin);
  const pathMaxVal = normalizeFrameNumber(state.filters.pathMax);
  const pathVal = normalizeFrameNumber(frame.path_number) ?? normalizeFrameNumber(frame.orbit);
  if (pathMinVal !== null && (pathVal === null || pathVal < pathMinVal)) return false;
  if (pathMaxVal !== null && (pathVal === null || pathVal > pathMaxVal)) return false;

  const min = normalizeFrameNumber(state.filters.frameMin);
  const max = normalizeFrameNumber(state.filters.frameMax);
  if (min !== null && (frame.frame_number_norm === null || frame.frame_number_norm < min)) return false;
  if (max !== null && (frame.frame_number_norm === null || frame.frame_number_norm > max)) return false;

  if (state.filters.dateStart && frame.date && frame.date.slice(0, 10) < state.filters.dateStart) return false;
  if (state.filters.dateEnd && frame.date && frame.date.slice(0, 10) > state.filters.dateEnd) return false;

  return true;
}

    if (state.filters.satellite !== 'ALL' && frame.satellite_id !== state.filters.satellite) return false;
    if (state.filters.direction !== 'ALL' && frame.direction_norm !== state.filters.direction) return false;
    if (state.filters.formats.size && !state.filters.formats.has(frame.product_type_norm)) return false;
    return frame.frame_number_norm !== null;
  }).map(frame => frame.frame_number_norm);
}

function estimateNextExpected() {
  const grouped = new Map();
  for (const frame of state.filteredFrames) {
    if (!frame.date) continue;
    const timestamp = new Date(frame.date).getTime();
    if (!Number.isFinite(timestamp)) continue;
    const key = [
      frame.satellite_id,
      frame.direction_norm,
      frame.path_number || 'NA',
      frame.frame_number_norm ?? 'NA',
    ].join('|');
    if (!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push(timestamp);
  }

  const candidates = [];
  for (const [key, values] of grouped.entries()) {
    const uniq = [...new Set(values)].sort((a, b) => a - b);
    if (uniq.length < 2) continue;
    const intervals = [];
    for (let i = 1; i < uniq.length; i++) {
      intervals.push((uniq[i] - uniq[i - 1]) / 86400000);
    }
    const avg = intervals.reduce((sum, value) => sum + value, 0) / intervals.length;
    const last = uniq[uniq.length - 1];
    const next = last + avg * 86400000;
    candidates.push({ key, avg, last, next });
  }

  if (!candidates.length) return null;
  candidates.sort((a, b) => a.next - b.next);
  return candidates[0];
}

function updateNextExpected() {
  const el = document.getElementById('st-next');
  if (!el) return;
  const forecast = estimateNextExpected();
  if (!forecast) {
    el.textContent = 'Need history';
    return;
  }

  const nextDate = new Date(forecast.next);
  const days = Math.round((forecast.next - Date.now()) / 86400000);
  const prefix = days <= 0 ? 'Watch now' : `${days}d`;
  el.textContent = `${nextDate.getMonth() + 1}/${nextDate.getDate()} · ${prefix}`;
}

function escapeXml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

function createMeta4(frames, source) {
  const selected = frames.filter(frame => {
    return source === 'ASF'
      ? !!frame.asf_url
      : !!(frame.copernicus_url || frame.download_url);
  });

  const lines = [
    '<?xml version="1.0" encoding="UTF-8"?>',
    '<metalink xmlns="urn:ietf:params:xml:ns:metalink">',
    `  <!-- generated ${new Date().toISOString()} -->`,
    `  <!-- ${selected.length} filtered items -->`,
  ];

  for (const frame of selected) {
    const url = source === 'ASF' ? frame.asf_url : (frame.copernicus_url || frame.download_url);
    const name = source === 'Copernicus' ? `${frame.granule}.SAFE.zip` : frame.granule;
    lines.push(`  <file name="${escapeXml(name)}">`);
    if (frame.file_size_mb) lines.push(`    <size>${Math.round(Number(frame.file_size_mb) * 1000000)}</size>`);
    lines.push(`    <url priority="1">${escapeXml(url)}</url>`);
    lines.push('  </file>');
  }
  lines.push('</metalink>');
  return { text: lines.join('\n'), count: selected.length };
}

function triggerDownload(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = filename;
  anchor.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function buildDownloadName(prefix, ext) {
  ensureAdvancedState();
  const sat = state.filters.satellite === 'ALL' ? 'all' : state.filters.satellite.toLowerCase();
  const dir = state.filters.direction === 'ALL' ? 'all' : state.filters.direction.toLowerCase();
  return `${prefix}_${sat}_${dir}_${new Date().toISOString().slice(0,10)}.${ext}`;
}

function renderFrames() {
  ensureAdvancedState();
  state.frameLayer.clearLayers();
  state.framePolygons = [];

  for (const frame of state.filteredFrames) {
    const geom = frame.footprint;
    if (!geom || geom.type !== 'Polygon' || !Array.isArray(geom.coordinates)) continue;

    const rings = geom.coordinates.map(ring => ring.map(coord => [coord[1], coord[0]]));
    const color = platColor(frame.platform || frame.satellite_name);
    const key = getFrameKey(frame);
    const polygon = L.polygon(rings, {
      color,
      baseColor: color,
      weight: 1.6,
      fillColor: color,
      fillOpacity: 0.1,
      opacity: 0.82,
    });

    polygon.on('mouseover', function() {
      if (state.selectedFrameKey === key) return; // 已選取不干擾
      this.setStyle({ weight: 2.8, fillOpacity: 0.24, opacity: 1 });
    });
    polygon.on('mouseout', function() {
      if (state.selectedFrameKey === key) return;
      const hasSelection = !!state.selectedFrameKey;
      this.setStyle({ weight: hasSelection ? 1 : 1.6, fillOpacity: hasSelection ? 0.03 : 0.1, opacity: hasSelection ? 0.2 : 0.82 });
    });
    polygon.on('click', (e) => {
      L.DomEvent.stopPropagation(e); // 避免觸發 map click
      if (state.selectedFrameKey === key) {
        state.selectedFrameKey = null; // 點擊第二次取消選取
        closeDrawer();
      } else {
        state.selectedFrameKey = key;
        openFrameDrawer(frame); // 開啟抽屜並顯示群組化資訊
      }
      updateMapSelectionState();
    });

    state.frameLayer.addLayer(polygon);
    state.framePolygons.push({ key, polygon });
  }

  updateMapSelectionState();
}

async function liveFetchASF() {
  ensureAdvancedState();
  const now = new Date();
  const start = new Date(now - 7 * 24 * 3600 * 1000);
  const fmt = value => value.toISOString().replace(/\.\d+Z$/, 'UTC');
  const url = 'https://api.daac.asf.alaska.edu/services/search/param?' + new URLSearchParams({
    intersectsWith: 'POLYGON((119 21,123 21,123 26.5,119 26.5,119 21))',
    platform: 'S1A,S1B,S1C,S1D,NISAR',
    processingLevel: 'SLC,GRD_HD,GRD_MS,GRD_HS,GRD_FD,RSLC,GSLC,L1_RSLC,L1_GSLC,L2_GCOV,L2_GUNW',
    start: fmt(start),
    end: fmt(now),
    output: 'geojson',
    maxresults: 1000,
  });

  try {
    const response = await fetch(url);
    const payload = await response.json();
    state.rawFrames = (payload.features || []).map(feature => {
      const p = feature.properties || {};
      return enhanceFrame({
        source: 'ASF',
        granule: p.sceneName || '',
        platform: p.platform || '',
        sensor: p.sensor || '',
        date: p.startTime || '',
        stop_time: p.stopTime || '',
        mode: p.beamModeType || p.beamMode || '',
        polarization: p.polarization || '',
        orbit: p.orbit || '',
        path_number: p.pathNumber || '',
        frame_number: p.frameNumber || '',
        direction: p.flightDirection || '',
        product_type: p.processingLevel || '',
        processing_level: p.processingLevel || '',
        footprint: feature.geometry,
        asf_url: p.url || '',
        file_size_mb: +(p.sizeMB || 0).toFixed(1),
      });
    }).filter(frame => frame.is_open_data);

    state.baseStats = {
      total_frames: state.rawFrames.length,
      query_start: start.toISOString(),
      query_end: now.toISOString(),
      asf_count: state.rawFrames.length,
      copernicus_count: 0,
    };
    document.getElementById('hdr-time').textContent = 'Live ASF ' + new Date().toLocaleString('zh-TW');
    renderSatelliteSelect();
    renderFormatOptions();
    resetAdvancedFilters(false);
    applyAdvancedFilters();
  } catch (error) {
    document.getElementById('hdr-time').textContent = 'Load failed';
    console.error('ASF API failed', error);
  }
}

function getFrameSeriesKey(frame) {
  return [
    frame.satellite_id || '',
    frame.direction_norm || '',
    getFramePathNumber(frame) ?? '',
    frame.frame_number_norm ?? '',
  ].join('|');
}

function getFrameKey(frame) {
  return normalizeGranuleKey(frame.granule) || [
    getFrameSeriesKey(frame),
    (frame.date || '').slice(0, 19),
  ].join('|');
}

function getHistoryEntryKey(frame) {
  return [
    getFrameSeriesKey(frame),
    (frame.date || '').slice(0, 19),
    frame.product_type_norm || '',
    frame.mode || '',
  ].join('|');
}

function normalizeGranuleKey(granule) {
  return String(granule || '')
    .replace(/\.SAFE$/i, '')
    .trim()
    .toUpperCase();
}

function updateNextExpected() {
  const el = document.getElementById('st-next');
  if (!el) return;
  const latestFor = (direction, path) => {
    const match = state.rawFrames
      .filter(frame => frame.direction_norm === direction && getFramePathNumber(frame) === path)
      .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0))[0];
    if (!match || !match.date) return `${direction === 'ASCENDING' ? 'A69' : 'D105'} --`;
    const date = new Date(match.date);
    return `${direction === 'ASCENDING' ? 'A69' : 'D105'} ${date.getMonth() + 1}/${date.getDate()}`;
  };
  el.textContent = `${latestFor('ASCENDING', 69)} | ${latestFor('DESCENDING', 105)}`;
}

function renderFrames() {
  ensureAdvancedState();
  state.frameLayer.clearLayers();
  state.framePolygons = [];

  const seenKeys = new Set();

  for (const frame of state.filteredFrames) {
    const geom = frame.footprint;
    if (!geom || geom.type !== 'Polygon' || !Array.isArray(geom.coordinates)) continue;

    const key = getFrameKey(frame);
    if (seenKeys.has(key)) continue;
    seenKeys.add(key);

    const rings = geom.coordinates.map(ring => ring.map(coord => [coord[1], coord[0]]));
    const color = frame.track_label === 'A69'
      ? '#00e5ff'
      : frame.track_label === 'D105'
        ? '#ff7043'
        : frame.track_label === 'NISAR'
          ? '#00e676'
          : platColor(frame.platform || frame.satellite_name);

    const polygon = L.polygon(rings, {
      color,
      baseColor: color,
      weight: 1.8,
      fillColor: color,
      fillOpacity: 0.1,
      opacity: 0.85,
    });

    polygon.on('mouseover', function() {
      if (state.selectedFrameKey === key) return;
      this.setStyle({ weight: 3.2, fillOpacity: 0.28, opacity: 1 });
    });
    polygon.on('mouseout', function() {
      if (state.selectedFrameKey === key) return;
      const hasSelection = !!state.selectedFrameKey;
      this.setStyle({ weight: hasSelection ? 1 : 1.8, fillOpacity: hasSelection ? 0.03 : 0.1, opacity: hasSelection ? 0.2 : 0.85 });
    });
    polygon.on('click', (e) => {
      L.DomEvent.stopPropagation(e);
      if (state.selectedFrameKey === key) {
        state.selectedFrameKey = null;
        closeDrawer();
      } else {
        state.selectedFrameKey = key;
        openFrameDrawer(frame);
      }
      updateMapSelectionState();
    });

    state.frameLayer.addLayer(polygon);
    state.framePolygons.push({ key, polygon });
  }

  updateMapSelectionState();
}

    const size = frame.file_size_mb ? `${frame.file_size_mb} MB` : '--';
    const actions = [
      asfUrl ? `<button type="button" onclick="copyDrawerLink(this, '${asfUrl}')" style="cursor:pointer;flex:1;padding:6px 10px;background:rgba(0,229,255,0.1);color:var(--cyan);border:1px solid var(--cyan);border-radius:4px;font-family:var(--mono);font-size:10px;">Copy ASF</button>` : '',
      cdseUrl ? `<button type="button" onclick="copyDrawerLink(this, '${cdseUrl}')" style="cursor:pointer;flex:1;padding:6px 10px;background:rgba(255,112,67,0.1);color:var(--orange);border:1px solid var(--orange);border-radius:4px;font-family:var(--mono);font-size:10px;">Copy CDSE</button>` : '',
    ].filter(Boolean).join('');

    return `
      <div style="margin-bottom:14px;padding:10px;background:rgba(0,0,0,0.15);border:1px solid var(--border);border-radius:6px;">
        <div style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text-hi);margin-bottom:8px;word-break:break-all;line-height:1.45;">
          ${frame.granule || 'Unknown Granule'}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;">
          <span style="font-family:var(--mono);font-size:11px;color:var(--muted);">${frame.product_type_norm || 'OCN'} · ${size}</span>
          <span style="font-family:var(--mono);font-size:11px;color:var(--muted);">${frame.date ? new Date(frame.date).toLocaleString('zh-TW') : '--'}</span>
        </div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-bottom:10px;line-height:1.4;">
          ${frame.direction_norm || '--'} · path ${getFramePathNumber(frame) ?? '--'} · frame ${frame.frame_number_norm ?? 'Unavailable'}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${actions || '<span style="color: var(--muted); font-size: 11px;">No download URL available.</span>'}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('d-desc').innerHTML = cards || '<span style="color: var(--muted)">No file matches the current selection.</span>';
  document.getElementById('drawer').classList.add('open');
}

window.addEventListener('DOMContentLoaded', async () => {
  ensureAdvancedState();
  applyAppearanceSettings();
  syncAppearanceControls();
  setupReadableUI();
  bindAppearanceControls();
  bindAdvancedControls();
  initMap();
  await loadData();

  setTimeout(() => {
    document.getElementById('loading').classList.add('gone');
  }, 700);
});
</script>
</body>
</html>
