name: Update SAR acquisition data

on:
  schedule:
    # Five times a day, expressed here in UTC. Taiwan (UTC+8) has no DST, so
    # these map to a fixed local clock year-round:
    #   UTC 00:00 → 08:00 Taiwan
    #   UTC 02:00 → 10:00 Taiwan
    #   UTC 04:00 → 12:00 Taiwan
    #   UTC 09:00 → 17:00 Taiwan
    #   UTC 15:00 → 23:00 Taiwan
    - cron: '0 0,2,4,9,15 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days to query back (default 7)'
        required: false
        default: '3'
      overlap_days:
        description: 'Incremental overlap days to recheck around the last successful fetch'
        required: false
        default: '2'
      full_rebuild:
        description: 'Set true to rebuild the full metadata catalog'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Job 1: Fetch data, generate meta4, commit ────────────────────────────
  update-data:
    name: Fetch ASF + Copernicus data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      data-changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Per-mission catalogs (data/catalog/*.json) are gitignored local build
      # state; without them every run would rebuild the full history from ASF
      # and Copernicus instead of fetching incrementally from the watermark.
      - name: Restore catalog cache
        uses: actions/cache@v4
        with:
          path: data/catalog
          key: catalog-db-${{ github.run_id }}
          restore-keys: catalog-db-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pure stdlib — no extra packages needed
      # Uncomment below to use the asf_search SDK in future
      # - run: pip install asf-search

      - name: Run data fetch
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '3' }}
          INCREMENTAL_OVERLAP_DAYS: ${{ github.event.inputs.overlap_days || '2' }}
          FORCE_FULL_REBUILD: ${{ github.event.inputs.full_rebuild || 'false' }}
          # NISAR S-band (ISRO/Bhoonidhi). Unset until a token is issued by
          # NRSC, in which case the S-band source logs a skip and the run
          # continues with ASF's L-band only.
          BHOONIDHI_TOKEN: ${{ secrets.BHOONIDHI_TOKEN }}
        run: python fetch_sar_data.py

      - name: Print summary
        run: |
          python - << 'EOF'
          import json
          # sar_status.js is JSON wrapped in a JS assignment so one file can
          # serve both file:// and the web; peel the wrapper to read it here.
          text = open('data/sar_status.js', encoding='utf-8').read().strip()
          d = json.loads(text[len('window.__SAR_DATA='):].rstrip(';'))
          print(f"Updated at   : {d['updated_at']}")
          print(f"Total frames : {d['total_frames']}")
          print(f"  ASF        : {d.get('asf_count', '?')}")
          print(f"  Copernicus : {d.get('copernicus_count', '?')}")
          print(f"Satellites   : {d['satellite_summary']}")
          import os; print(f"ASF meta4    : {os.path.getsize('data/asf_taiwan.meta4')} bytes")
          print(f"COP meta4    : {os.path.getsize('data/copernicus_taiwan.meta4')} bytes")
          EOF

      - name: Save catalog cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/catalog
          key: catalog-db-${{ github.run_id }}

      - name: Commit & push updated data
        id: commit
        run: |
          git config user.name  "SAR Monitor Bot"
          git config user.email "sar-monitor[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes, skipping commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "data: automated SAR data update $(date -u '+%Y-%m-%d')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  # ── Job 2: Deploy to GitHub Pages ────────────────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: update-data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (with latest data/)
        uses: actions/checkout@v4
        with:
          ref: main   # ensure we get the just-committed data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject cache-busting version into index.html
        run: |
          VER=$(git rev-parse --short HEAD)
          sed -i "s|styles\.css\"|styles.css?v=$VER\"|g"                index.html
          sed -i "s|src=\"app\.js\"|src=\"app.js?v=$VER\"|g"            index.html
          sed -i "s|sar_recent\.json|sar_recent.json?v=$VER|g"          app.js
          sed -i "s|sar_status\.js|sar_status.js?v=$VER|g"              app.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # entire repo root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
