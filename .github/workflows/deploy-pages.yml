name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Inject cache-busting version into index.html
        run: |
          VER=$(git rev-parse --short HEAD)
          sed -i "s|styles\.css\"|styles.css?v=$VER\"|g"                index.html
          sed -i "s|src=\"app\.js\"|src=\"app.js?v=$VER\"|g"            index.html
          sed -i "s|sar_recent\.json|sar_recent.json?v=$VER|g"          app.js
          sed -i "s|sar_status\.json|sar_status.json?v=$VER|g"          app.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Package entire repo root (includes index.html and data/)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4