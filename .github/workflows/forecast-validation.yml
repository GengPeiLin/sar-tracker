# Scores the standing predictions against what was actually acquired, once a
# day, and records the next ones. It runs against the default branch, which is
# also where the code it drives now lives: checking out anything else would
# validate a copy that is not what visitors get.
#
# Run it by hand with:  python forecast_validation.py

name: Branch validation

on:
  schedule:
    # 01:30 UTC, half an hour after the 01:00-ish data update, so the catalog
    # it scores against already has the night's acquisitions in it.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Score the outstanding predictions and record the next ones
    runs-on: ubuntu-latest
    steps:
      # The catalog this scores against is committed here by the data job, so
      # a plain checkout already has the night's acquisitions in it.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The data pipeline is deliberately stdlib-only; this job is the one
      # exception, because SGP4 is not something to reimplement by hand.
      - name: Install sgp4
        run: pip install 'sgp4==2.23'

      - name: Run validation
        run: python forecast_validation.py

      - name: Commit the log
        run: |
          git config user.name  "SAR Monitor Bot"
          git config user.email "sar-monitor[bot]@users.noreply.github.com"
          # Only the machine-readable log is committed. The run also writes
          # docs/forecast-accuracy.md, which is gitignored and stays local:
          # regenerate it any time with `python forecast_validation.py`.
          git add data/forecast_log.json
          # Neither the catalog nor anything under docs/ may be committed by
          # this job: the data job owns the catalog, and the write-up and the
          # scoreboard are deliberately not published.
          if git diff --cached --name-only | grep -qE '^(data/sar_(status\.js|recent\.json)|docs/)'; then
            echo "::error::a file that must not be committed is staged"
            git diff --cached --stat
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No change, skipping commit"
          else
            git commit -m "data: forecast validation $(date -u '+%Y-%m-%d')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
